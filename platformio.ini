; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32_COM8]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM8
monitor_speed = 115200

[env:esp32_COM7]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM7
monitor_speed = 115200

[env:esp32_COM3]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_speed = 115200

; --- ESP-NOW stepper sync experiment (esp-now-sync branch) -----------------
; Isolated from the envs above via build_src_filter: these build only
; src_espnow/espnow_stepper_sync.cpp, never src/main.cpp, so they cannot
; collide with the existing single-sensor firmware. upload_port is left
; unset so PlatformIO auto-detects; add one back if you have both boards
; plugged in at once and need to pick between them.

[env:espnow_master]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../src_espnow/espnow_stepper_sync.cpp>
build_flags = -DROLE_MASTER

[env:espnow_slave]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../src_espnow/espnow_stepper_sync.cpp>
build_flags = -DROLE_SLAVE

